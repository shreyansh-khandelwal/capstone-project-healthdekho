

# Generated by GitHub Copilot - Oct-19-2026
# Production profile. Datasource and Bedrock credentials are loaded from AWS Secrets
# Manager (same approach as d11_employee_service_secretsmanager); the secret name comes
# from SECRET_NAME and must contain the keys SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY. A missing secret or key fails fast at startup.
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: healthdekho
    default-schema: healthdekho
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: healthdekho
  config:
    import: "aws-secretsmanager:${SECRET_NAME}"
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  ai:
    bedrock:
      aws:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      converse:
        chat:
          model: ${BEDROCK_CONVERSE_MODEL}

server:
  port: ${PORT:5000}
  forward-headers-strategy: framework
 
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
 
 
# Spring Cloud AWS: region used to reach Secrets Manager.
spring.cloud.aws:
  region:
    static: ${AWS_REGION:ap-south-1}
 
