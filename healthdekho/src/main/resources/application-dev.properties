spring.application.name=healthdekho

spring.datasource.url=jdbc:postgresql://localhost:5432/healthdekho
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# AWS region where Bedrock model access is enabled.
spring.ai.bedrock.aws.region=ap-south-1

# Set the default model for Spring AI to Bedrock Converse
spring.ai.model.chat=bedrock-converse

# Bedrock Converse model ID.
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_CONVERSE_MODEL}


server.port=8090